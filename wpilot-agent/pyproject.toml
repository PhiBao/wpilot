[project]
name = "wpilot-agent"
version = "0.1.0"
description = "wpilot — backfill agent for volunteer-run shifts (Agents for Humans hackathon)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "strands-agents==1.54.0",
  "bedrock-agentcore==1.22.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  # Model providers for the agent loop (resolved by env in resolve_model).
  # Bedrock needs no extra package (SigV4 or AWS_BEARER_TOKEN_BEDROCK chain).
  "anthropic==1.4.0",
  "openai==3.8.0",
  # Local-provider fallback for offline loop verification (OllamaModel).
  "ollama==0.6.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
