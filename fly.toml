# Fly.io target for the wpilot demo API.
# NOTE: auto_stop_machines is OFF on purpose — the demo keeps roster state
# and the simulated SMS inbox in memory, so the machine must stay warm
# while judges click through. Scale to zero only after judging.
app = "wpilot-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.api"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
